<svg class="engex-pyramid" viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engex-pyramid-title engex-pyramid-desc">
  <title id="engex-pyramid-title">An engineer's hierarchy of needs</title>
  <desc id="engex-pyramid-desc">A four-tier pyramid. From the base upward: Communication, Daily routine, Growth, Compensation. Lower tiers cost more effort and pay off over a longer horizon; higher tiers are cheaper, shorter-term levers.</desc>

  <defs>
    <!-- orient is pinned: with orient="auto" a marker-start gets rotated to the
         line's direction, which lays the top arrowhead on its side -->
    <marker id="engex-cap-up" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="9" markerHeight="9" orient="0">
      <path d="M5 0 L10 10 L0 10 Z" fill="var(--ink-3)"/>
    </marker>
    <marker id="engex-cap-down" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="9" markerHeight="9" orient="0">
      <path d="M5 10 L0 0 L10 0 Z" fill="var(--ink-3)"/>
    </marker>
  </defs>

  <g font-family="var(--font-sans)">
    <!-- tiers, apex first: fill opacity climbs toward the base so weight reads
         off the drawing before you get to the axes -->
    <g stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" fill="var(--accent)">
      <polygon points="500,52 561.3,154.5 438.7,154.5" fill-opacity="0.10"/>
      <polygon points="436.3,158.5 563.7,158.5 623.8,259 376.2,259" fill-opacity="0.18"/>
      <polygon points="373.8,263 626.2,263 686.3,363.5 313.7,363.5" fill-opacity="0.27"/>
      <polygon points="311.3,367.5 688.7,367.5 750,470 250,470" fill-opacity="0.37"/>
    </g>

    <g fill="var(--ink)" font-size="25" font-weight="600" text-anchor="middle" dominant-baseline="central">
      <text x="500" y="120" font-size="34" aria-label="Compensation">$</text>
      <text x="500" y="209">Growth</text>
      <text x="500" y="313">Daily routine</text>
      <text x="500" y="419">Communication</text>
    </g>

    <!-- flanking axes -->
    <g stroke="var(--ink-3)" stroke-width="1.5">
      <line x1="188" y1="52" x2="188" y2="470" marker-start="url(#engex-cap-up)" marker-end="url(#engex-cap-down)"/>
      <line x1="812" y1="52" x2="812" y2="470" marker-start="url(#engex-cap-up)" marker-end="url(#engex-cap-down)"/>
    </g>

    <g fill="var(--ink-3)" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0.09em">
      <text x="188" y="30">PAYOFF HORIZON</text>
      <text x="812" y="30">EFFORT</text>
    </g>

    <g fill="var(--ink-2)" font-size="20">
      <g text-anchor="end">
        <text x="166" y="72">Short-term</text>
        <text x="166" y="459">Long-term</text>
      </g>
      <g text-anchor="start">
        <text x="834" y="72">Less</text>
        <text x="834" y="459">More</text>
      </g>
    </g>
  </g>
</svg>
