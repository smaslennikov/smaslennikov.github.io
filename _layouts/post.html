---
layout: default
---

<article>
  <header class="post-head">
    <p class="post-head__meta">
      <span>{{ page.date | date: "%-d %B %Y" }}</span>
      <span>{{ page.author | default: site.author }}</span>
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.haiku %}
      <p class="post-head__haiku">{{ page.haiku }}</p>
    {% endif %}
  </header>

  {{ content }}

  <footer class="post-foot">
    <a href="{{ "/" | relative_url }}">&larr; all writing</a>
  </footer>
</article>
