---
layout: default
---

<h1>{{ page.title }}</h1>

{{ content }}

<ul class="gallery">
  {% for image in site.static_files %}
    {% if image.path contains page.path %}
      <li>
        <a href="{{ image.path | relative_url }}">
          <img src="{{ image.path | relative_url }}" alt="" loading="lazy">
        </a>
      </li>
    {% endif %}
  {% endfor %}
</ul>
